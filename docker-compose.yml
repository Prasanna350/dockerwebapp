---
services:
  frontend:
    image: pashadeviprasanna943/dockerwebapp-app-image
    ports:
      - "3000:8080"
    networks:
      - newnetwork
    depends_on:
      - devopsdb
    deploy:
      replicas: 2

  devopsdb:
    image: pashadeviprasanna943/dockerwebapp-db-image
    ports:
      - "3306:3306"
    networks:
      - newnetwork
    volumes:
      - dbvolume:/var/lib/mysql/
    deploy:
      replicas: 2
    environment:
      MYSQL_ROOT_PASSWORD: devopspassword

networks:
  newnetwork:
    driver: overlay

volumes:
  dbvolume:

...
